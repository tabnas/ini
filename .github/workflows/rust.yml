# PROPOSED workflow -- lives in ci/workflows/ for review; move to
# .github/workflows/rust.yml to activate, per admin DECISIONS.md ADR-8.
#
# The Rust gate. Standalone rather than an arm of build.yml, because that
# workflow builds the TypeScript and Go halves against a cloned sibling
# closure and takes no Rust input: promoting this file needs no change
# there.
name: Rust

# Runs on EVERY branch push, not just main, and the path lists are
# written out twice.
#
# Both are deliberate, for the reasons docs.yml records: GitHub Actions
# has no YAML anchors, so a version sharing one list between the two
# triggers does not run at all; and restricting `push` to main while
# leaning on `pull_request` leaves a gate that reaches a pull request
# green because it never executed.
on:
  # `branches` is set explicitly. A `push` trigger that names neither
  # branches nor tags also matches TAG pushes, and Actions does not
  # evaluate `paths` for a tag ref -- so without this, release.yml
  # pushing `ts/v…` and `go/v…` would run this whole gate once per tag,
  # on a ref where the path filters mean nothing.
  push:
    branches: [ '**' ]
    paths:
      - 'rs/**'
      - 'test/**'
      - 'ini-grammar.jsonic'
      - 'ts/embed-grammar.js'
      - 'ts/package.json'
      - 'ci/rust/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'rs/**'
      - 'test/**'
      - 'ini-grammar.jsonic'
      - 'ts/embed-grammar.js'
      - 'ts/package.json'
      - 'ci/rust/**'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      # CRLF corrupts the .tsv fixtures, which the Rust suite reads from
      # test/spec the same way the other two runtimes do. build.yml sets
      # this for the same reason.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      # Checked out into a NAMED directory. rs/Cargo.toml takes the
      # engine as `path = "../../parser/rs"` (and the jsonic base
      # grammar, the hoover block lexer and the fixture runner the same
      # way), which resolves relative to rs/, so the siblings have to sit
      # beside this checkout rather than inside it. A bare
      # `actions/checkout` into the workspace root leaves nowhere for
      # them to go.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          path: ini

      # Sibling main, not a release: the crates are unpublished, so this
      # is the only resolution there is. It is also the one CI already
      # uses for Go, so both ports are measured against the same engine.
      - name: Clone the sibling crates
        run: |
          git clone --depth 1 https://github.com/tabnas/parser.git parser
          git clone --depth 1 https://github.com/tabnas/json.git json
          git clone --depth 1 https://github.com/tabnas/jsonic.git jsonic
          git clone --depth 1 https://github.com/tabnas/hoover.git hoover
          git clone --depth 1 https://github.com/tabnas/support.git support

      # Pinned to the MSRV in rs/Cargo.toml rather than to `stable`, so
      # this fails on a change that needs a newer compiler instead of
      # passing here and breaking for anyone honouring rust-version.
      #
      # NOTE for promotion: the other actions here are SHA-pinned, this
      # one is not. It matches the form tabnas/parser's own staged
      # ci/workflows/rust.yml uses; pin it to a SHA at promotion time if
      # the org prefers that uniformly.
      - name: Set up Rust MSRV
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
          components: rustfmt, clippy

      # Everything else lives in the script so this file and a
      # contributor's local run cannot say different things.
      - name: Rust gate
        run: ini/ci/rust/run.sh
